name: Comment on PR
on:
  workflow_run:
    workflows: ["PR Workflow"]
    types:
      - completed

jobs:
  comment:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      
      - name: Read PR number and data
        id: pr-data
        run: |
          echo "pr_number=$(cat pr_number)" >> $GITHUB_OUTPUT
          echo "result=$(cat result.txt)" >> $GITHUB_OUTPUT
      
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr-data.outputs.pr_number }},
              body: `## 🤖 Workflow Results\n\n${{ steps.pr-data.outputs.result }}\n\n*This comment was posted by workflow_run*`
            });
